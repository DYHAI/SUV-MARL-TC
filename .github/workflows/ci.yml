name: repository-checks

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile maintained Python files
        run: python -m compileall -q code scripts/check_runtime.py
      - name: Check maintained shell scripts
        run: for script in scripts/*.sh; do bash -n "$script"; done
      - name: Ensure credentials are absent
        run: test ! -e cds_api_keys.json
